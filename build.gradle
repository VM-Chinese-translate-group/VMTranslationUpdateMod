import com.google.gson.JsonElement
import com.google.gson.JsonParser
import xyz.wagyourtail.unimined.api.minecraft.task.RemapJarTask

plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.1'
    id 'com.gradleup.shadow' version '8.+'
    id 'com.hypherionmc.modutils.modpublisher' version '2.1.8'
}

base.archivesName = project.property('archives_base_name')
version = "${project.property('mod_version')}+mc${project.property('minecraft_version')}"
group = project.property('maven_group')

unimined.minecraft {
    version(project.property('minecraft_version').toString())

    mappings {
        calamus()
        feather(31)

        stubs(['searge', 'feather']) {
            c(['net/minecraft/entity/item/EntityMinecart']) {
                // fix conflict with forge added function name
                m('func_174898_m;()D', 'getMaxSpeedVanilla')
            }
        }

        devNamespace('feather')
    }

    minecraftForge {
        loader(project.property('forge_version').toString())
    }

    defaultRemapJar = true
}

configurations {
    shade
}

repositories {
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation "com.github.VM-Chinese-translate-group:VMTUCore:${project.property('core_version')}"
    shade "com.github.VM-Chinese-translate-group:VMTUCore:${project.property('core_version')}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mc_version', project.property('minecraft_version')

    filesMatching('mcmod.info') {
        expand([
            'version': project.version,
            'mc_version': project.property('minecraft_version')
        ])
    }
}

tasks.withType(JavaCompile).all {
    options.encoding = 'UTF-8'
    //options.release = 8
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8

    withSourcesJar()
}

shadowJar {
    //relocate 'top.vmctcn.vmtu.core', 'vmtu.include.core'

    from project.configurations.shade
    archiveClassifier = 'dev-shadow'
}

tasks.named('remapJar', RemapJarTask) {
    inputFile = shadowJar.archiveFile
    dependsOn shadowJar
    //archiveClassifier = ''
}

jar {
    archiveClassifier = 'dev'
}

processResources.dependsOn 'convertLanguageFiles'
// Fix implicit dependency: sourcesJar must run after convertLanguageFile
// because sourcesJar includes generated files in src/main/resources
tasks.named('sourcesJar').get().dependsOn 'convertLanguageFiles'

// JSON to Lang file gradle task
tasks.register('convertLanguageFiles') {
    description = 'Convert JSON language files to Minecraft *.lang format'

    def inputDir = file('scripts/inputs')
    def outputDir = file('src/main/resources/assets/vmtranslationupdate/lang')

    inputs.dir inputDir
    outputs.dir outputDir

    doLast {
        // Ensure output directory exists
        outputDir.mkdirs()

        // Get all JSON files
        def jsonFiles = inputDir.listFiles { file ->
            file.isFile() && file.name.toLowerCase().endsWith('.json')
        } ?: []

        if (jsonFiles.length == 0) {
            logger.warn "⚠️ No JSON files found in ${inputDir.absolutePath}"
            return
        }

        logger.lifecycle "♻️ Starting conversion of ${jsonFiles.length} JSON file(s)..."

        jsonFiles.each { jsonFile ->
            def langFileName = jsonFile.name.take(jsonFile.name.lastIndexOf('.')) + '.lang'
            def langFile = new File(outputDir, langFileName)

            try {
                // Read and parse JSON
                def jsonContent = jsonFile.text
                def jsonElement = JsonParser.parseString(jsonContent)

                if (!jsonElement.isJsonObject()) {
                    throw new IllegalArgumentException("JSON file must contain an object: ${jsonFile.name}")
                }

                def jsonObject = jsonElement.getAsJsonObject()

                // Flatten nested JSON and convert to lang format
                def langLines = []
                langLines.add '# This file is auto-generated by Gradle task'
                langLines.add '# Please modify with caution'
                langLines.add ''

                // Recursively flatten JSON object
                def flattenJson
                flattenJson = { element, parentKey = '' ->
                    if (element.isJsonObject()) {
                        element.getAsJsonObject().entrySet().each { entry ->
                            def key = entry.getKey()
                            def value = entry.getValue()
                            def newKey = parentKey.isEmpty() ? key : "$parentKey.$key"
                            flattenJson(value, newKey)
                        }
                    } else if (element.isJsonPrimitive()) {
                        def primitive = element.getAsJsonPrimitive()
                        def value
                        if (primitive.isBoolean()) {
                            value = primitive.getAsBoolean().toString()
                        } else if (primitive.isNumber()) {
                            value = primitive.getAsNumber().toString()
                        } else {
                            value = primitive.getAsString()
                        }
                        langLines.add "$parentKey=$value"
                    } else if (element.isJsonArray()) {
                        // Serialize array to JSON string
                        langLines.add "$parentKey=${element.toString()}"
                    } else if (element.isJsonNull()) {
                        langLines.add "$parentKey=null"
                    }
                }

                flattenJson(jsonObject)

                // Write lang file
                langFile.text = langLines.join('\n')

                logger.lifecycle "✅ Converted: ${jsonFile.name} -> $langFileName (${langLines.size() - 3} key-value pairs)"

            } catch (Exception e) {
                throw new RuntimeException("Failed to convert file ${jsonFile.name}: ${e.message}", e)
            }
        }

        logger.lifecycle "✅ Language file conversion completed! Output directory: ${outputDir.absolutePath}"
    }
}

publisher {
    apiKeys {
        modrinth System.getenv('MODRINTH_TOKEN')
        curseforge System.getenv('CURSEFORGE_TOKEN')
    }

    curseID = project.property('curseforge_id')
    modrinthID = project.property('modrinth_id')
    versionType = project.property('version_type')
    changelog = rootProject.file('CHANGELOG.md').text
    projectVersion = "forge-${project.version}"
    displayName = "[Forge]${project.version}"
    gameVersions = [project.property('minecraft_version')]
    loaders = ['forge']
    curseEnvironment = 'client'
    artifact = tasks.remapJar
    addAdditionalFile tasks.sourcesJar
}
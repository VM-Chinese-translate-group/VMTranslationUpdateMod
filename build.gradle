plugins {
    id "java"
    id "xyz.wagyourtail.unimined" version "1.4.+"
    id "com.gradleup.shadow" version "8.+"
}

base.archivesName = project.archives_base_name
version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

unimined.minecraft {
    version("${project.minecraft_version}")

    mappings {
        calamus()
        feather(28)

        stubs(["searge", "feather"]) {
            c(["net/minecraft/entity/item/EntityMinecart"]) {
                // fix conflict with forge added function name
                m("func_174898_m;()D", "getMaxSpeedVanilla")
            }
        }

        devNamespace("feather")
    }

    minecraftForge {
        loader forge_version
    }

    defaultRemapJar = true
}

configurations {
    shade
}

repositories {
    maven { url = "https://jitpack.io" }
}

dependencies {
    implementation("com.github.VM-Chinese-translate-group:VMTUCore:${project.core_version}:all")
    shade("com.github.VM-Chinese-translate-group:VMTUCore:${project.core_version}:all")
}

shadowJar {
    relocate("top.vmctcn.vmtu.core", "vmtu.include.core")

    configurations = [project.configurations.shade]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    inputFile.set(shadowJar.archiveFile)
    dependsOn shadowJar
    archiveClassifier.set(null)
}

jar {
    archiveClassifier.set("dev")
}

processResources {
    inputs.property "version", project.version
    inputs.property "mc_version", project.minecraft_version

    filesMatching("mcmod.info") {
        expand "version": project.version, "mc_version": project.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    //options.release = 8
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8

    withSourcesJar()
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : project.mod_id,
                "Specification-Vendor"    : project.mod_author,
                "Specification-Version"   : version,
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : version,
                "Implementation-Vendor"   : project.mod_author,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

processResources.dependsOn("convertLangFile")
tasks.register("convertLangFile", Exec) {
    commandLine("python", "scripts/json2LangConverter.py", "jsonLang", "-o", "src/main/resources/assets/vmtranslationupdate/lang")
    workingDir projectDir
}
